[pytest]
# The repository is mounted into containers running as different users; keep the
# cache out of it.
cache_dir = /tmp/pytest-cache
testpaths = tests
python_files = test_*.py
addopts = -ra --strict-markers --timeout=300
markers =
    unit: synthetic-fixture tests; no Docker, no network
    integration: requires the live Docker stack
    offline: asserts behaviour with no network at all
    slow: takes more than a few seconds (CRL expiry waits)
