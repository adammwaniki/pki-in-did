# Test and publish did-x509-policy.
#
# Tests run on every push and pull request that touches the package. Images are published only
# from a tag, so `latest` always corresponds to something someone deliberately released.
#
# Tag to release:
#     git tag did-x509-policy-v1.0.0 && git push origin did-x509-policy-v1.0.0
#
# The tag is prefixed because this repository also holds the demonstration the package was
# extracted from, and the two version independently.

name: did-x509-policy

"on":
  push:
    branches: [main]
    paths: ['did-x509-policy/**', '.github/workflows/did-x509-policy.yml']
    tags: ['did-x509-policy-v*']
  pull_request:
    paths: ['did-x509-policy/**', '.github/workflows/did-x509-policy.yml']
  workflow_dispatch:

defaults:
  run:
    working-directory: did-x509-policy

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/did-x509-policy

jobs:
  test:
    name: test on ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares; the ceiling is what is current. A library this
        # small should work on both without special cases.
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e '.[http,service,test]'

      - name: Test
        run: pytest -q

      - name: Check the version in the package matches the tag
        if: startsWith(github.ref, 'refs/tags/did-x509-policy-v')
        run: |
          tag="${GITHUB_REF#refs/tags/did-x509-policy-v}"
          package="$(python -c 'import did_x509_policy as p; print(p.__version__)')"
          project="$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          echo "tag=$tag  __version__=$package  pyproject=$project"
          # A published image whose version does not match its tag is a trap for whoever
          # pins it later, so this is a hard failure rather than a warning.
          test "$tag" = "$package" || { echo "::error::__version__ ($package) does not match the tag ($tag)"; exit 1; }
          test "$tag" = "$project" || { echo "::error::pyproject version ($project) does not match the tag ($tag)"; exit 1; }

  image:
    name: build the image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build for this platform only, and prove it runs
        uses: docker/build-push-action@v6
        with:
          context: did-x509-policy
          load: true
          tags: did-x509-policy:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # An image that starts is not the same as an image that works. This asks it to reject
      # something, because rejecting correctly is the whole job.
      - name: Smoke test the built image
        working-directory: .
        run: |
          set -euo pipefail
          openssl req -x509 -newkey rsa:2048 -noenc -days 1 -subj /CN=CI\ Root \
            -addext basicConstraints=critical,CA:TRUE \
            -addext keyUsage=critical,keyCertSign,cRLSign \
            -keyout /tmp/ci.key -out /tmp/ci-root.pem 2>/dev/null

          docker run -d --name dxp -p 8080:8080 \
            -e DID_X509_TRUST_ANCHOR_PEM="$(cat /tmp/ci-root.pem)" \
            did-x509-policy:ci
          for _ in $(seq 1 40); do
            curl -fsS -o /dev/null http://127.0.0.1:8080/healthz && break
            sleep 2
          done

          echo "--- healthz reports the anchor and the checks ---"
          curl -fsS http://127.0.0.1:8080/healthz \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); \
                assert d["status"]=="ok", d; \
                assert len(d["trustAnchors"])==1, d; \
                assert len(d["checks"])==15, d; \
                print("ok:", d["version"], d["cache"])'

          echo "--- the policy in force can be read back ---"
          curl -fsS http://127.0.0.1:8080/policy | python3 -c 'import json,sys; \
                d=json.load(sys.stdin); assert d["require_spki_jwk_binding"] is True, d; print("ok")'

          echo "--- rubbish is rejected with 422 and a reason, not a crash ---"
          code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST http://127.0.0.1:8080/verify \
            -H 'Content-Type: application/json' -d '{"credential":"not a credential"}')
          test "$code" = "422" || { echo "expected 422, got $code"; cat /tmp/out; exit 1; }
          python3 -c 'import json; d=json.load(open("/tmp/out")); \
                assert d["accepted"] is False and d["reason"]=="malformed_credential", d; print("ok")'

          echo "--- a missing credential is the caller'\''s error, 400 ---"
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/verify \
            -H 'Content-Type: application/json' -d '{}')
          test "$code" = "400" || { echo "expected 400, got $code"; exit 1; }

          docker rm -f dxp >/dev/null

  publish:
    name: publish to GHCR
    runs-on: ubuntu-latest
    needs: [test, image]
    if: startsWith(github.ref, 'refs/tags/did-x509-policy-v')
    permissions:
      contents: read
      packages: write
      id-token: write      # provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # did-x509-policy-v1.2.3 publishes :1.2.3, :1.2 and :latest. No bare major tag:
          # a verifier is not something to float across major versions by accident.
          tags: |
            type=match,pattern=did-x509-policy-v(\d+\.\d+\.\d+),group=1
            type=match,pattern=did-x509-policy-v(\d+\.\d+)\.\d+,group=1
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=did-x509-policy
            org.opencontainers.image.description=The PKI policy layer a conformant DID verifier leaves to you.

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: did-x509-policy
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Summarise
        run: |
          {
            echo '### Published'
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "digest \`${{ steps.push.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
