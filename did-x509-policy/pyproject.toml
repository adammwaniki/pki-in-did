[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "did-x509-policy"
version = "1.0.0"
description = "The PKI policy layer a conformant DID verifier leaves to you: validate the x5c chain behind a did:web verification method against your own trust anchors, with or without a network."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["did", "did:web", "verifiable-credentials", "x509", "pkix", "x5c", "ocsp", "crl", "openid4vp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]

# The library needs one thing. Everything else is optional, which is what makes it embeddable.
dependencies = [
  "cryptography>=42,<45",
]

[project.optional-dependencies]
# Fetching over the network. Omit for a verifier that only ever works from a cache.
http = ["requests>=2.31,<3"]
# The HTTP service.
service = ["starlette>=0.37,<1", "uvicorn>=0.30,<1"]
test = ["pytest>=8,<9", "pytest-timeout>=2.3,<3", "httpx>=0.27,<1"]

[project.scripts]
did-x509-policy = "did_x509_policy.cli:main"

[project.urls]
Homepage = "https://github.com/adammwaniki/pki-in-did/tree/main/did-x509-policy"
Source = "https://github.com/adammwaniki/pki-in-did"

[tool.hatch.build.targets.wheel]
packages = ["src/did_x509_policy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --timeout=60"
markers = [
  "unit: hermetic; no network, no container",
  "offline: asserts behaviour with no network at all",
  "slow: takes more than a few seconds",
]
