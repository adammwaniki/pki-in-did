# The demonstration, as four organisations on one network.
#
# The four domain names are Docker-network DNS aliases, so `did:web:jacarandapropaganda.com`
# resolves to the container that serves that organisation's DID document, over TLS issued by
# the demonstration's own Web-TLS CA. Nothing here binds a host port: this machine's 80 and
# 443 belong to something else.
#
# What is deliberately absent: the offline machine. The National Root CA's private key lives
# in state/offline and is mounted only into the `--network none` container that
# scripts/10-offline-root.sh and scripts/12-offline-sign-ca.sh run. It is not a service,
# because it is not meant to be reachable.

name: pki-in-did

x-logging: &logging
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "3" }

services:

  # domain1 -- the National Root CA's public face: one certificate, nothing else.
  nrca-web:
    build: { context: ., dockerfile: images/web/Dockerfile }
    image: pki-in-did/web
    container_name: pki-nrca-web
    restart: unless-stopped
    environment:
      NRCA_DOMAIN: ${NRCA_DOMAIN:-adamndegwa.com}
    volumes:
      - ./config/nginx/nrca.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./state/web/nrca:/srv/nrca:ro
      - ./state/tls:/tls:ro
    networks:
      demo:
        aliases: [ "${NRCA_DOMAIN:-adamndegwa.com}" ]
    <<: *logging

  # domain2 -- the Issuing CA: the OCSP responder and the CRL, both over HTTP.
  issuing-ca:
    build: { context: ., dockerfile: images/ca-tools/Dockerfile }
    image: pki-in-did/ca-tools
    container_name: pki-issuing-ca
    restart: unless-stopped
    command: [ "serve" ]
    volumes:
      - ./config/nginx/issuing-ca.nginx.conf:/etc/nginx/nginx.conf:ro
      - ./state/web/issuing-ca:/srv/issuing-ca:ro
    depends_on:
      ocsp-responder:
        condition: service_started
    networks:
      demo:
        aliases: [ "${ISSUING_CA_DOMAIN:-mwaniki.dev}" ]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *logging

  # The OCSP responder: `openssl ocsp`, behind domain2's nginx, as brief step 16 specifies.
  #
  # It reads the same index.txt that `openssl ca -revoke` maintains. A wrapper watches that
  # file and restarts the responder when it changes, because `openssl ocsp` reads the
  # database only at startup -- so "revoke, then verify again" needs nothing republished.
  ocsp-responder:
    build: { context: ., dockerfile: images/ca-tools/Dockerfile }
    image: pki-in-did/ca-tools
    container_name: pki-ocsp-responder
    restart: unless-stopped
    command: ["/usr/local/bin/ocsp-responder"]
    environment:
      CA_DIR: /ca
      OCSP_PORT: "2560"
      OCSP_RESPONSE_MINUTES: ${OCSP_RESPONSE_MINUTES:-5}
    volumes:
      - ./state/ca:/ca:ro
    networks:
      demo:
        aliases: [ "ocsp-responder" ]
    <<: *logging

  # domain3 -- credential issuer A: DID document over HTTPS.
  issuer-a-web:
    build: { context: ., dockerfile: images/web/Dockerfile }
    image: pki-in-did/web
    container_name: pki-issuer-a-web
    restart: unless-stopped
    environment:
      ISSUER_DOMAIN: ${ISSUER_A_DOMAIN:-jacarandapropaganda.com}
    volumes:
      - ./config/nginx/issuer.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./state/web/issuer-a:/srv/issuer:ro
      - ./state/tls:/tls:ro
    networks:
      demo:
        aliases: [ "${ISSUER_A_DOMAIN:-jacarandapropaganda.com}" ]
    <<: *logging

  # domain4 -- credential issuer B: DID document over HTTPS.
  issuer-b-web:
    build: { context: ., dockerfile: images/web/Dockerfile }
    image: pki-in-did/web
    container_name: pki-issuer-b-web
    restart: unless-stopped
    environment:
      ISSUER_DOMAIN: ${ISSUER_B_DOMAIN:-lawnbull.com}
    volumes:
      - ./config/nginx/issuer.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./state/web/issuer-b:/srv/issuer:ro
      - ./state/tls:/tls:ro
    networks:
      demo:
        aliases: [ "${ISSUER_B_DOMAIN:-lawnbull.com}" ]
    <<: *logging

  # Credential issuer A's issuance service: walt.id issuer-api2, OpenID4VCI 1.0.
  # Reachable only on the internal network -- GET /issuer2/profiles returns the private key.
  issuer-a-api:
    image: ${WALTID_IMAGE:-waltid/issuer-api2:1.0.0}
    container_name: pki-issuer-a-api
    restart: unless-stopped
    volumes:
      - ./state/waltid/issuer-a:/waltid-issuer-api2/config:ro
    networks:
      demo:
        aliases: [ "issuer-a-api" ]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7005"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    <<: *logging

  # Credential issuer B's issuance service.
  issuer-b-api:
    image: ${WALTID_IMAGE:-waltid/issuer-api2:1.0.0}
    container_name: pki-issuer-b-api
    restart: unless-stopped
    volumes:
      - ./state/waltid/issuer-b:/waltid-issuer-api2/config:ro
    networks:
      demo:
        aliases: [ "issuer-b-api" ]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7005"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    <<: *logging

  # The holder: walt.id wallet-api2. It generates and holds the holder key, creates the DID,
  # runs the OpenID4VCI issuance flow with DPoP-bound tokens, stores credentials, and runs the
  # OpenID4VP presentation flow. src/holder/wallet.py only drives it over HTTP.
  wallet-api:
    image: ${WALLET_API_IMAGE:-waltid/wallet-api2:1.0.0}
    container_name: pki-wallet-api
    restart: unless-stopped
    volumes:
      - ./config/waltid-wallet:/waltid-wallet-api2/config:ro
      - ./state/wallet:/data
    networks:
      demo:
        aliases: [ "wallet-api" ]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7006"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    <<: *logging

  # The impostor. Serves one DID document, whose JWK carries a genuine national certificate
  # chain beside a key that chain does not certify. Nothing here is forged; see
  # src/issuer/make_impostor.py for why that is the point.
  impostor-web:
    build: { context: ., dockerfile: images/web/Dockerfile }
    image: pki-in-did/web
    container_name: pki-impostor-web
    restart: unless-stopped
    environment:
      ISSUER_DOMAIN: ${IMPOSTOR_DOMAIN:-impostor.example}
    volumes:
      - ./config/nginx/issuer.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./state/web/impostor:/srv/issuer:ro
      - ./state/tls:/tls:ro
    networks:
      demo:
        aliases: [ "${IMPOSTOR_DOMAIN:-impostor.example}" ]
    <<: *logging

  # A real verifier: walt.id verifier-api2, OpenID4VP 1.0 with DCQL.
  #
  # It is here to make an argument rather than to do our job. It performs the standards-
  # conformant half of verification -- resolve the DID, check the presentation and the
  # credential signature -- and it does NOT look at x5c, because no conformant verifier does.
  # That is precisely the gap the source document describes, and demo/part5-the-gap.sh shows
  # it: this service returns SUCCESSFUL for a credential whose certificate chain is
  # decorative, and the PKI policy layer in src/verifier rejects it.
  #
  # The image adds the demonstration's Web-TLS root to the JVM trust store so that did:web
  # resolution can happen over HTTPS on this network. See images/verifier-api/Dockerfile.
  verifier-api:
    build:
      context: .
      dockerfile: images/verifier-api/Dockerfile
    image: pki-in-did/verifier-api
    container_name: pki-verifier-api
    restart: unless-stopped
    volumes:
      - ./config/waltid-verifier:/waltid-verifier-api2/config:ro
    networks:
      demo:
        aliases: [ "verifier-api" ]
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/7004"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    <<: *logging

networks:
  demo:
    name: pki-in-did_demo
    driver: bridge
