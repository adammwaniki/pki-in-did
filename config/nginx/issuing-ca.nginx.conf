# domain2 -- the Issuing CA's revocation services, on HTTP as the brief specifies.
#
# OCSP responses and CRLs are signed objects, so they are conventionally served over plain
# HTTP; fetching them over TLS would make revocation checking depend on revocation checking.
#
# This is the whole nginx configuration for the ca-tools container, which runs nginx and the
# OCSP responder side by side.

worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events { worker_connections 256; }

# nginx resolves the responder's name at startup from Docker's DNS.

http {
    access_log /dev/stdout;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    server {
        listen 80 default_server;
        server_name _;

        # The CRL. Published deliberately, by hand, which is what makes the revocation
        # window in part 3 a real window.
        location = /issuing-ca.crl {
            root /srv/issuing-ca;
            default_type application/pkix-crl;
            add_header Cache-Control 'no-cache';
        }

        location = /issuing-ca.pem {
            root /srv/issuing-ca;
            default_type application/x-pem-file;
        }

        # The OCSP responder. It runs as its own service, because it needs a reason code
        # OpenSSL's CLI cannot express -- see src/ca/revocation_service.py.
        location = /ocsp {
            proxy_pass http://ocsp-responder:2560/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_read_timeout 10s;
        }

        location = /healthz { return 200 "ok\n"; }

        location / { return 404; }
    }
}
